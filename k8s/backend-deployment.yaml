apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: amazon-clone
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: backend
          image: ACR_NAME.azurecr.io/amazon-clone-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: SECRET_KEY
            - name: CORS_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: CORS_ORIGINS
            - name: ACCESS_TOKEN_EXPIRE_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: amazon-clone-config
                  key: ACCESS_TOKEN_EXPIRE_MINUTES
            - name: REFRESH_TOKEN_EXPIRE_DAYS
              valueFrom:
                configMapKeyRef:
                  name: amazon-clone-config
                  key: REFRESH_TOKEN_EXPIRE_DAYS
            - name: MAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: MAIL_USERNAME
                  optional: true
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: MAIL_PASSWORD
                  optional: true
            - name: MAIL_FROM
              valueFrom:
                configMapKeyRef:
                  name: amazon-clone-config
                  key: MAIL_FROM
            - name: MAIL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: amazon-clone-config
                  key: MAIL_SERVER
            - name: MAIL_PORT
              valueFrom:
                configMapKeyRef:
                  name: amazon-clone-config
                  key: MAIL_PORT
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
