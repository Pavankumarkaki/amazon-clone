apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: amazon-clone
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do
                echo "waiting for postgres..."
                sleep 2
              done
      containers:
        - name: migrate
          image: amazonclonepavan123.azurecr.io/amazon-clone-backend:latest
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: amazon-clone-secrets
                  key: DATABASE_URL
